<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mars</title>
    <style>
      body {
        background-color: black;
        margin: 0;
      }
    </style>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"
    ></script>
  </head>
  <body>
    <model-viewer
      src="Mars.glb"
      alt="3D model"
      auto-rotate
      auto-rotate-delay="0"
      rotation-per-second="20deg"
      disable-pan
      disable-tap
      interaction-prompt="none"
      environment-image="neutral"
      camera-orbit="0deg 90deg auto"
      min-camera-orbit="auto 70deg auto"
      max-camera-orbit="auto 30deg auto"
      camera-controls
      style="width: 100%; height: 500px"
    ></model-viewer>
  </body>
</html>
